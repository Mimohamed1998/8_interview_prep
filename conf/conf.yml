# Configuration File
# Project settings and parameters

# Data paths
data:
  raw_path: data/input/raw/
  processed_path: data/input/processed/
  intermediate_path: data/Intermediate/
  output_path: data/output/

# Model parameters
model:
  random_state: 42
  test_size: 0.2
  validation_size: 0.1

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Visualization
visualization:
  theme: mckinsey
  dpi: 300
  figsize: [10, 6]

# Raw processing
raw_processing:
  files:
    sales:   invoice_level_sales.csv
    product: Product Mapping.csv
    region:  Region Mapping.csv
  sales:
    drop_columns:         [is_direct_distributor]
    return_document_type: return
    id_columns_to_str:    [outlet_id, territory_id]
  region:
    id_columns_to_str: [territory_id]

# Item classification
item_classification:
  # activity_rate = n_active_months / total_months  (active = gross_quantity > 0)
  # cv            = std / mean  on non-zero demand months only
  thresholds:
    activity_continuous_min: 0.80   # activity_rate >= this → eligible for Continuous
    cv_continuous_max:        0.50   # cv < this            → Continuous (with activity check)
    activity_lumpy_max:       0.20   # activity_rate < this → Lumpy
    cv_lumpy_min:             1.00   # cv > this            → Lumpy
  special_flags:
    structural_collapse: prod_line3   # -29.7% CAGR: piecewise trend required
    hyper_growth:        prod_line17  # +163.6% CAGR: Bass diffusion / short window

modeling:
  # Time-based split — hard boundary, never random
  train_start: "2015-04"
  train_end:   "2018-12"
  eval_start:  "2019-01"
  eval_end:    "2019-10"

  # Target column names
  target_regressor:  "target_qty_raw"
  target_classifier: "target_is_nonzero"

  # MLflow
  mlflow_experiment:   "demand_forecasting"
  mlflow_tracking_uri: "mlruns"

  # RandomizedSearchCV
  n_iter:    1
  cv_splits: 3
  random_state: 42

  # Two-stage decision threshold (Stage 1 classifier)
  classifier_threshold: 0.5

  # Output directory for saved .pkl models
  model_output_path: "../../data/output/models"

  # Columns to drop from feature matrix before training
  drop_columns:
    identifiers:      ["outlet_id", "item_code", "year_month"]
    geo_admin:        ["territory_id", "region", "district", "province"]
    product_admin:    ["product_category", "product_line", "brand"]
    segment_strings:  ["cluster_definition", "demand_class"]
    target_leakage:   ["target_qty_raw", "target_qty_log1p", "target_is_nonzero", "target_log1p_net_sales"]

  # XGBoost hyperparameter search space (used by RandomizedSearchCV)
  xgb_param_grid:
    n_estimators:      [100, 200, 300, 500]
    max_depth:         [3, 4, 5, 6, 7]
    learning_rate:     [0.01, 0.05, 0.1, 0.2]
    subsample:         [0.6, 0.8, 1.0]
    colsample_bytree:  [0.6, 0.8, 1.0]
    min_child_weight:  [1, 3, 5]
    reg_alpha:         [0, 0.1, 0.5, 1.0]
    reg_lambda:        [0.5, 1.0, 2.0]

inference:
  start: "2018-10"
  end:   "2019-12"
  cell_data_path:   "data/Intermediate"
  model_path:       "data/output/models"
  output_path:      "data/bu_raw_output/inference_parquet"
  csv_output_path:  "data/bu_raw_data/inference_bu"

buffer:
  n_months: 2   # rolling look-back window for error correction
